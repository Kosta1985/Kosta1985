name: Publish Brisbane Landscaping Group temporary preview
on:
  push:
    branches:
      - brisbane-landscaping-preview
permissions:
  contents: read
  statuses: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Upload static site to free temporary preview
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          zip -qr /tmp/brisbane-landscaping.zip index.html styles.css script.js privacy.html photo-credits.html favicon.svg robots.txt assets guides
          response="$(curl -fsS --retry 3 --retry-delay 3 --connect-timeout 15 --max-time 90 -X POST https://ship.page/deploy -H "Content-Type: application/zip" --data-binary @/tmp/brisbane-landscaping.zip)"
          url="$(printf %s "$response" | jq -er .url)"
          case "$url" in https://*.ship.place/*) ;; *) echo "Unexpected deploy URL" >&2; exit 1;; esac
          echo "Public temporary URL: $url"
          printf "### Brisbane Landscaping Group preview\n%s\n" "$url" >> "$GITHUB_STEP_SUMMARY"
          payload="$(jq -cn --arg url "$url" '{state:"success",target_url:$url,description:"Free temporary preview (expires)",context:"Brisbane Landscaping site preview"}')"
          curl -fsS --retry 2 -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" -H "Content-Type: application/json" --data "$payload" "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" >/dev/null
